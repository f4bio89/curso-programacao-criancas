<style>
:root{--yellow:#FFC400;--yellow-light:#FFF3B0;--navy:#172033;--white:#fff;--bg:#F4F5F7;--green:#22A866;--blue:#3B82F6;--purple:#8B5CF6;--orange:#F97316;--red:#DF4B4B;--line:#E3E6EB;--radius:18px;--shadow:0 5px 0 #17203318}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--navy);font:17px/1.5 Nunito,system-ui,sans-serif}.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;z-index:99;background:#fff;padding:.7rem;border:2px solid var(--navy)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.app{min-height:100vh}.mobilebar,.mobile-nav{display:none}.sidebar{position:fixed;inset:0 auto 0 0;width:264px;background:var(--navy);color:#fff;padding:22px 14px;z-index:20;overflow:auto}.logo{display:flex;align-items:center;gap:9px;padding:0 8px 18px;border-bottom:1px solid #ffffff20}.bulb{width:45px;height:45px;flex:none}.logo h1{margin:0;font:700 1.55rem/1 Fredoka}.logo h1 b{color:var(--yellow)}.logo small{font-weight:800;font-size:.64rem;letter-spacing:.1em;color:#ffffffa8}.nav{margin:18px 0}.nav button{display:flex;width:100%;border:0;border-radius:11px;color:#dce2ec;background:transparent;padding:10px 12px;gap:10px;align-items:center;text-align:left;font-weight:800}.nav-symbol{width:25px;height:22px;display:grid;place-items:center;border:1px solid #ffffff35;border-radius:6px;color:var(--yellow);font:800 .62rem JetBrains Mono,monospace;flex:none}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav button.active{box-shadow:inset 4px 0 var(--yellow)}.side-progress{background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:13px}.side-progress p{margin:0 0 7px;font-size:.78rem;font-weight:800}.track{height:9px;background:#ffffff2b;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--yellow);border-radius:99px;transition:width .35s}.side-tip{margin-top:14px;background:var(--yellow-light);color:var(--navy);padding:12px;border-radius:13px;font-size:.83rem;font-weight:700}.side-tip b{display:block;font-family:Fredoka;font-size:1rem}.main{margin-left:264px;min-height:100vh}.top{background:var(--yellow);min-height:175px;padding:25px max(28px,calc((100vw - 1200px)/2));border-bottom:5px solid var(--navy);position:relative;overflow:hidden}.top:after{content:'</>  { }';position:absolute;right:3%;top:-40px;font:700 clamp(5rem,13vw,11rem) Fredoka;color:#17203313;transform:rotate(-8deg)}.top>*{position:relative;z-index:1}.top h2{margin:5px 0 0;font:700 clamp(1.9rem,4vw,3.25rem)/1 Fredoka}.eyebrow{font-size:.78rem;letter-spacing:.12em;font-weight:800}.content{max-width:1200px;margin:auto;padding:24px}.page{display:none}.page.active{display:block}.dash-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:20px;margin-top:-65px;position:relative;z-index:3}.panel,.mission-card,.achievement,.backpack-item{background:var(--white);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.hero-card{padding:24px;border-color:var(--navy);box-shadow:7px 7px 0 var(--navy)}.hero-card h3{font:700 2rem/1 Fredoka;margin:7px 0}.hero-card p{margin:.4rem 0 14px}.big-progress{display:flex;align-items:end;gap:14px}.big-progress strong{font:700 2.3rem/1 Fredoka;color:var(--orange)}.big-progress span{font-weight:800;font-size:.85rem}.cta{border:2px solid var(--navy);border-radius:12px;background:var(--yellow);box-shadow:3px 3px 0 var(--navy);padding:11px 15px;color:var(--navy);font-weight:800}.cta:hover{transform:translate(-1px,-1px)}.next-card{padding:20px}.next-card h3{font:700 1.25rem Fredoka;margin:5px 0}.next-card .next{background:var(--yellow-light);border-radius:13px;padding:13px;margin:12px 0}.next small,.muted{color:#63708a;font-weight:700}.section-title{font:700 1.6rem Fredoka;margin:30px 0 12px}.journey{position:relative;padding:18px;overflow:auto}.path{display:flex;align-items:center;min-width:760px;gap:0}.node{width:110px;text-align:center;position:relative;z-index:2}.node:not(:last-child):after{content:'';position:absolute;width:77px;border-top:3px dashed #c5cad2;top:23px;left:72px;z-index:-1}.node .orb{width:47px;height:47px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#e5e7eb;border:2px solid #b9c0cb;font-size:1.25rem}.node.done .orb{background:var(--green);border-color:var(--navy)}.node.current .orb{background:var(--yellow);border:3px solid var(--navy);animation:float 2s ease-in-out infinite}.node span{display:block;font-size:.72rem;font-weight:800;margin-top:6px}@keyframes float{50%{transform:translateY(-5px)}}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}.mission-card{padding:15px;position:relative;cursor:pointer;transition:.18s;text-align:left;width:100%;font:inherit;color:var(--navy)}.profile-choice{border:2px solid var(--line)}.mission-card:hover{transform:translateY(-4px);border-color:var(--navy);box-shadow:0 8px 0 var(--yellow)}.mission-card h3{font:700 1.2rem/1.05 Fredoka;margin:7px 0}.mission-card .status{position:absolute;right:12px;top:11px;font-weight:900}.mission-card.locked{opacity:.55}.phase{font-size:.7rem;font-weight:900;letter-spacing:.08em;color:var(--orange);text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:17px;text-align:center}.stat strong{display:block;font:700 1.8rem Fredoka;color:var(--orange)}.stat span{font-size:.75rem;font-weight:800}.mission-head{padding:24px}.mission-head h3{font:700 clamp(2rem,4vw,3.2rem)/1 Fredoka;margin:8px 0}.meta{display:flex;flex-wrap:wrap;gap:7px}.chip{border-radius:99px;padding:4px 9px;background:var(--yellow-light);font-size:.76rem;font-weight:900}.mission-progress{margin:15px 0}.mission-progress .track{background:#e6e8ed}.mission-progress .track i{background:var(--green)}.steps{display:grid;gap:9px;margin-top:16px}.step{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.step summary{padding:13px 15px;font:700 1.05rem Fredoka;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}.step summary::-webkit-details-marker{display:none}.step[open]{border-color:var(--navy)}.step summary:after{content:'⌄';font-family:Nunito}.step[open] summary:after{transform:rotate(180deg)}.step-body{padding:0 15px 16px}.complete-step{background:var(--green);border:2px solid var(--navy);border-radius:10px;padding:8px 11px;font-weight:900;color:#fff}.lumi-tip{background:var(--yellow-light);border:2px dashed var(--orange);border-radius:13px;padding:13px;margin:12px 0}.tip-out{font-weight:800;margin:.5rem 0}.code{background:var(--navy);color:#eaf1ff;border-radius:12px;padding:14px;overflow:auto;font:500 .85rem/1.7 'JetBrains Mono',monospace}.bug-box{border:2px solid var(--orange);background:#fff8ed;border-radius:14px;padding:14px}.sim{background:#f8f9fb;border:2px solid var(--line);border-radius:14px;padding:14px}.sim h4{font:700 1.1rem Fredoka;margin:0 0 7px}.sim-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.sim-controls button{border:2px solid var(--navy);border-radius:9px;background:#fff;padding:7px 10px;font-weight:900}.sim-controls button:hover{background:var(--yellow)}.board{display:grid;grid-template-columns:repeat(4,38px);gap:4px;margin:12px auto;width:max-content}.cell{height:38px;border-radius:8px;background:#e4e7ed;display:grid;place-items:center}.cell.treasure{background:var(--yellow-light)}.cell.robot{background:var(--blue);color:#fff}.variable{font:700 1.5rem Fredoka;padding:12px;background:var(--yellow-light);border:2px solid var(--yellow);border-radius:12px;display:inline-block}.achievement-grid,.backpack{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.achievement,.backpack-item{padding:16px}.achievement.locked{filter:grayscale(1);opacity:.55}.achievement .icon{font-size:2rem}.achievement h3,.backpack-item h3{font:700 1.2rem Fredoka;margin:6px 0}.teacher{border-left:6px solid var(--yellow);padding:16px;background:#fff;border-radius:0 14px 14px 0;margin:12px 0}.teacher h3{font:700 1.25rem Fredoka;margin:0 0 7px}.modal{position:fixed;inset:0;background:#172033a8;display:none;place-items:center;z-index:50;padding:18px}.modal.show{display:grid}.modal-card{max-width:430px;background:#fff;border:3px solid var(--navy);border-radius:24px;padding:28px;text-align:center;box-shadow:9px 9px 0 var(--yellow)}.modal-card h2{font:700 2.2rem Fredoka;margin:8px}.modal-card .medal{font-size:4rem}.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:11px 14px;border-radius:12px;font-weight:800;display:none;z-index:60}.toast.show{display:block;animation:in .25s}@keyframes in{from{transform:translateY(12px);opacity:0}}@media(max-width:850px){.sidebar{display:none}.main{margin:0}.mobilebar{display:flex;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px;justify-content:space-between;align-items:center}.mobilebar button{background:var(--yellow);border:0;border-radius:8px;padding:7px;font-weight:900}.mobile-nav{display:none;position:fixed;inset:50px 10px auto 10px;z-index:31;padding:10px;background:var(--navy);border-radius:12px}.mobile-nav.show{display:block}.mobile-nav button{display:block;width:100%;padding:10px;text-align:left;border:0;background:transparent;color:#fff;font-weight:800}.dash-grid{grid-template-columns:1fr;margin-top:-45px}.top{padding:20px}.content{padding:16px}.stats{grid-template-columns:1fr}.journey{padding:12px}.hero-card{box-shadow:4px 4px 0 var(--navy)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stop-point{margin-top:18px;padding:14px;border:2px dashed var(--yellow);border-radius:14px;background:var(--yellow-light)}.stop-point p{margin:.3rem 0}.modal[aria-hidden="true"]{display:none}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}</style></head>

<main class="main"><header class="top"><div class="eyebrow" id="eyebrow">PAINEL DA PROGRAMADORA</div><h2 id="page-title">Olá, Programadora!</h2></header><div class="content" id="view"></div></main></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text" aria-hidden="true"><div class="modal-card"><div class="medal" aria-hidden="true">🏅</div><h2 id="modal-title">Missão cumprida!</h2><p id="modal-text"></p><button class="cta" id="modal-close" onclick="closeModal()">🚀 Continuar aventura</button></div></div><div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
const M=[
['01','Domine seu Computador','digital','🖱️','Conhecer desktop, janelas, mouse e teclado.','Criar um cartão “Meu computador”.'],['02','Detetive da Internet','digital','🔎','Descobrir links, downloads e mensagens estranhas.','Resolver três casos seguros de internet.'],['03','Organize sua Base Secreta','digital','📁','Usar pastas, nomes, salvar e encontrar arquivos.','Montar a pasta Base_Secreta.'],['04','Programe um Robô Humano','logica','🤖','Dar instruções em sequência e bem precisas.','Ensinar um robô humano.'],['05','O Poder da Repetição','logica','🔁','Encontrar padrões e usar repetição.','Criar uma dança de robô.'],['06','A Porta do Dragão','logica','🔀','Usar decisões se / então / senão.','Escolher caminhos no mapa.'],['07','Dê Vida ao Gato','scratch','🐱','Eventos, movimento e sequência no Scratch.','Animação de apresentação.'],['08','Resgate Espacial','scratch','🚀','Repetição para animar uma nave.','Nave voando entre estrelas.'],['09','Tesouro que Conta Pontos','scratch','💎','Variável de pontuação e toque.','Jogo de coletar tesouros.'],['10','Fuga do Meteoro','scratch','☄️','Condições e colisões.','Jogo de desviar de meteoros.'],['11','Estúdio de Jogos','scratch','🎮','Planejar, testar e melhorar um jogo.','Caça ao Cristal.'],['12','Olá, Python!','python','🐍','Mostrar textos com print().','Cartão digital de heroína.'],['13','O Quiz Conversador','python','💬','Perguntar com input e guardar respostas.','Quiz de três perguntas.'],['14','Criador de Super-Heróis','python','🦸','Juntar texto e variáveis.','Ficha de super-herói.'],['15','Cofre dos Números','python','🔐','Números, comparação e if.','Cofre de senha numérica.'],['16','Dado das Aventuras','python','🎲','Usar random para criar surpresa.','Dado virtual.'],['17','Aventura das Escolhas','python','🗺️','Criar caminhos com if, elif e else.','História interativa.'],['18','A Fábrica de Repetições','python','🏭','Repetir com for e while.','Contagem regressiva.'],['19','Pedra, Papel, Tesoura Turbo','jogos','✊','Random, regras, placar e repetição.','Jogo contra computador.'],['20','Bola 8 Mágica Gentil','jogos','🎱','Criar e chamar função simples.','Oráculo divertido.'],['21','Laboratório de Histórias','jogos','📚','Listas, random, texto e função.','Gerador de histórias.'],['22','Chatbot da Base Secreta','jogos','🤖','Input, condições, loop e função.','Chatbot simples.'],['23','Oficina da Inventora','final','🛠️','Planejar projeto próprio.','Protótipo final.'],['24','Grande Estreia','final','🏆','Testar, depurar e explicar.','Apresentação final.']];
const phases={digital:['Exploradora Digital',1,3],logica:['Pensamento Lógico',4,6],scratch:['Scratch',7,11],python:['Python',12,18],jogos:['Criando Jogos',19,22],final:['Projeto Final',23,24]};
const ACH=[['digital','💻','Exploradora Digital','Conclua as 3 primeiras missões.'],['bug','🐛','Caçadora de Bugs','Capture um bug interativo.'],['loops','🔁','Mestra dos Loops','Conclua a Missão 05 ou 18.'],['scratch','🎮','Criadora de Jogos','Conclua a Missão 11.'],['python','🐍','Programadora Python','Conclua a Missão 18.'],['inventora','💡','Inventora Digital','Conclua a Missão 24.']];
const ITEMS=[['files','📁','Arquivos','Uma pasta organiza coisas que pertencem à mesma aventura.',3],['sequence','🧩','Sequência','Instruções na ordem certa fazem o computador entender.',4],['loop','🔁','Loop','Repete uma ação sem copiar o mesmo comando muitas vezes.',5],['condition','🔀','Condição','Ajuda o programa a escolher um caminho.',6],['variable','📦','Variável','É uma caixinha que guarda algo que pode mudar.',9],['python','🐍','Python','É uma forma escrita de conversar com o computador.',12],['debug','🐛','Debug','Investigar uma pista até entender o que aconteceu.',15]];
const PROFILE_STORE='code-aventura-profiles-v1',ACTIVE_PROFILE='code-aventura-active-v1';let profiles=JSON.parse(localStorage.getItem(PROFILE_STORE)||'{}'),activeId=localStorage.getItem(ACTIVE_PROFILE);if(!Object.keys(profiles).length&&localStorage.getItem('code-aventura-v2')){profiles.migrada={name:'Aventureira',avatar:'LUMI',state:JSON.parse(localStorage.getItem('code-aventura-v2'))}}let state={done:{},steps:{},ach:{},bag:{}};function loadProfile(){state=profiles[activeId]?.state||{done:{},steps:{},ach:{},bag:{}}}function save(){if(activeId&&profiles[activeId]){profiles[activeId].state=state;localStorage.setItem(PROFILE_STORE,JSON.stringify(profiles));localStorage.setItem(ACTIVE_PROFILE,activeId)}}function profile(){return profiles[activeId]||null}function doneCount(){return Object.keys(state.done).filter(k=>state.done[k]).length}function achievementCount(){return ACH.filter(a=>achievement(a[0])).length}function pct(){return Math.round(doneCount()/24*100)}function unlocked(n){return n===1||!!state.done[String(n-1).padStart(2,'0')]}function current(){return M.find(x=>!state.done[x[0]])||null}function phaseName(k){return phases[k][0]}function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function nav(){let options=[['profile','ME','Meu Perfil'],['start','GO','Comece Aqui'],['home','IN','Início'],['journey','MAP','Minha Jornada'],['missions','MS','Missões'],['achievements','AW','Conquistas'],['bag','BAG','Minha Mochila'],['lumi','TIP','Dicas do Lumi'],['teacher','PRO','Área do Professor']];let s=options.map(x=>`<button data-page="${x[0]}" onclick="go('${x[0]}')"><span class="nav-symbol">${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('nav').innerHTML=s;document.getElementById('mobile-nav').innerHTML=s;document.getElementById('side-count').textContent=`${doneCount()} / 24`;document.getElementById('side-bar').style.width=pct()+'%'}function activeNav(p){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p))}function toggleMobileNav(){document.getElementById('mobile-nav').classList.toggle('show')}
function go(p,arg){document.getElementById('mobile-nav').classList.remove('show');activeNav(p);let title={profile:'Meu Perfil',start:'Como começar',home:'Olá, Programadora!',journey:'Minha Jornada',missions:'Missões',achievements:'Minhas Conquistas',bag:'Minha Mochila',lumi:'Dicas do Lumi',teacher:'Área do Professor',mission:'Sua Missão'}[p];document.getElementById('page-title').textContent=title;document.getElementById('eyebrow').textContent=p==='teacher'?'GUIA PARA O ADULTO':'CODE AVENTURA';let v=document.getElementById('view');v.className='page active';v.innerHTML=({profile:profilePage,start:start,home:home,journey,missions,achievements,bag,lumi,teacher}[p]||(()=>mission(arg)))();window.scrollTo(0,0)}
function profilePage(){let p=profile();return `<section class="panel mission-head"><span class="phase">PERFIL LOCAL</span><h3>${p?p.name:'Nova aventureira'}</h3><p>Este perfil guarda progresso somente neste navegador. Não usa senha, e-mail nem dados pessoais.</p>${p?`<p><b>${doneCount()}/24</b> missões concluídas.</p><button class="cta" onclick="exportProfile()">⬇ Exportar meu progresso</button> <button class="cta" onclick="go('home')">Continuar aventura</button>`:''}<h3>Trocar ou criar perfil</h3><input id="profile-name" maxlength="24" placeholder="Seu apelido de aventureira" aria-label="Nome do perfil"><button class="cta" onclick="createProfile()">Criar perfil</button><div class="cards">${Object.entries(profiles).map(([id,x])=>`<button class="mission-card profile-choice" type="button" onclick="activateProfile('${id}')" aria-label="Abrir perfil ${x.name}"><span class="phase">PERFIL</span><h3>${x.name}</h3><p>${Object.keys(x.state.done||{}).filter(k=>x.state.done[k]).length}/24 missões</p></button>`).join('')}</div><h3>Levar para outro computador</h3><p>Exporte um arquivo de backup aqui e use <b>Importar</b> no outro computador. O arquivo não deve ser publicado nem enviado para desconhecidos.</p><input id="import-file" type="file" accept="application/json"><button class="cta" onclick="importProfile()">Importar backup</button></section>`}function createProfile(){let name=document.getElementById('profile-name').value.trim();if(!name){showToast('Escolha um apelido para a aventureira.');return}let id='p'+Date.now();profiles[id]={name,avatar:'LUMI',state:{done:{},steps:{},ach:{},bag:{}}};activeId=id;loadProfile();save();nav();go('home')}function activateProfile(id){activeId=id;loadProfile();save();nav();go('home')}function exportProfile(){let blob=new Blob([JSON.stringify({version:1,profile:profile()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='code-aventura-'+profile().name.replace(/[^a-z0-9]/gi,'-')+'.json';a.click();URL.revokeObjectURL(a.href);showToast('Backup criado! Guarde em uma pasta segura.') }function importProfile(){let f=document.getElementById('import-file').files[0];if(!f){showToast('Escolha um arquivo de backup primeiro.');return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.profile?.name||!d.profile?.state)throw Error();let id='p'+Date.now();profiles[id]=d.profile;activeId=id;loadProfile();save();nav();go('home');showToast('Perfil importado com sucesso!')}catch(e){showToast('Esse arquivo não parece ser um backup do Code Aventura.')}};r.readAsText(f)}function boot(){if(!activeId||!profiles[activeId]){nav();go('profile')}else{loadProfile();nav();go('home')}}
function start(){return `<section class="panel mission-head"><span class="phase">BEM-VINDA AO CODE AVENTURA</span><h3>Como esta plataforma funciona</h3><p>Você não precisa saber programar antes. Aqui você aprende criando pequenas coisas, testando ideias e investigando bugs.</p><div class="lumi-tip"><b>💡 Regra do Lumi</b><p>Não tente acertar tudo de primeira. Escolha uma ideia pequena, teste e observe o que acontece.</p></div><h3>Para a criança</h3><ol><li>Clique em <b>Continuar Aventura</b>.</li><li>Abra uma etapa por vez; não precisa fazer tudo em um minuto.</li><li>Marque a etapa concluída quando terminar.</li><li>Use as Dicas do Lumi se travar.</li><li>Ao final, explique o que criou e qual bug investigou.</li></ol><h3>Para o adulto</h3><p><b>Ritmo recomendado:</b> 2 missões por semana, com 35–45 minutos cada. Antes da aula, abra o guia do professor. Durante a missão, deixe a criança controlar teclado e mouse; ajude com perguntas, não com respostas prontas.</p><div class="teacher"><h3>O que fica salvo?</h3><p>O progresso desta plataforma fica apenas neste navegador. Para acompanhar habilidades entre computadores, use o arquivo PROGRESSO.md.</p></div><button class="cta" onclick="go('home')">🚀 IR PARA O PAINEL</button> <a class="cta" target="_blank" href="https://github.com/f4bio89/curso-programacao-criancas/blob/main/COMECE_AQUI.md">Ler guia completo ↗</a></section>`}
function home(){let c=current(), complete=!c;let next=complete?`<article class="panel next-card"><span class="phase">JORNADA FINALIZADA</span><div class="next"><b>🏆 AVENTURA COMPLETA!</b><h3>Você completou as 24 missões.</h3><p>Mostre sua invenção, celebre suas conquistas e revisite qualquer missão quando quiser.</p></div><button class="cta" onclick="go('achievements')">VER CONQUISTAS</button></article>`:`<article class="panel next-card"><span class="phase">PRÓXIMA MISSÃO</span><div class="next"><b>MISSÃO ${c[0]}</b><h3>${c[3]} ${c[1]}</h3><p>${c[5]}</p></div><small>⏱ ~40 min &nbsp; ⭐ aventura prática</small></article>`;return `<section class="dash-grid"><article class="panel hero-card"><span class="phase">PAINEL DA AVENTURA</span><h3>👋 Olá, ${profile()?.name||'Programadora'}!</h3><p>${complete?'Sua aventura foi concluída. Que criação você quer melhorar agora?':'Sua aventura continua. Cada teste é uma descoberta nova.'}</p><div class="big-progress"><strong>${doneCount()}<small>/24</small></strong><span>missões concluídas<br>${pct()}% da jornada</span></div><div class="track"><i style="width:${pct()}%"></i></div><br>${complete?'<button class="cta" onclick="go(\'missions\')">🗺️ REVISITAR MISSÕES</button>':`<button class="cta" onclick="go('mission','${c[0]}')">🚀 CONTINUAR AVENTURA</button>`}</article>${next}</section><h3 class="section-title">🗺️ Onde você está?</h3>${journey()}<h3 class="section-title">O que você pode fazer agora</h3><section class="stats"><article class="panel stat"><strong>${doneCount()}</strong><span>MISSÕES FEITAS</span></article><article class="panel stat"><strong>${achievementCount()}</strong><span>CONQUISTAS</span></article><article class="panel stat"><strong>${Object.keys(state.bag).length}</strong><span>ITENS NA MOCHILA</span></article></section><h3 class="section-title">${complete?'✨ Missões para revisitar':'✨ Próximas missões'}</h3><section class="cards">${(complete?M:M.filter(x=>unlocked(+x[0])&&!state.done[x[0]])).slice(0,3).map(card).join('')}</section>`}
function journey(){let arr=Object.entries(phases);return `<section class="panel journey"><div class="path">${arr.map(([k,v])=>{let finished=M.filter(x=>x[2]===k).every(x=>state.done[x[0]]),now=current(),cur=now&&now[2]===k;return `<div class="node ${finished?'done':''} ${cur?'current':''}"><div class="orb">${finished?'✅':cur?'🚀':k==='scratch'?'🐱':k==='python'?'🐍':'⭐'}</div><span>${v[0]}</span></div>`}).join('')}</div></section>`}
function card(x){let available=unlocked(+x[0]),status=state.done[x[0]]?'✅':available?'⭐':'🔒';if(!available)return `<article class="mission-card locked" aria-label="Missão ${x[0]} bloqueada"><span class="status">${status}</span><span class="phase">MISSÃO ${x[0]} · ${phaseName(x[2])}</span><h3>${x[3]} ${x[1]}</h3><p>${x[5]}</p></article>`;return `<button class="mission-card" type="button" onclick="go('mission','${x[0]}')" aria-label="Abrir Missão ${x[0]}: ${x[1]}"><span class="status">${status}</span><span class="phase">MISSÃO ${x[0]} · ${phaseName(x[2])}</span><h3>${x[3]} ${x[1]}</h3><p>${x[5]}</p></button>`}
function missions(){return `<p class="muted">⭐ disponível &nbsp; ✅ concluída &nbsp; 🔒 continua depois — sem pressa.</p><section class="cards">${M.map(card).join('')}</section>`}
function achievements(){return `<p class="muted">Medalhas são conquistadas por habilidades reais, não por pressa.</p><section class="achievement-grid">${ACH.map(a=>{let got=achievement(a[0]);return `<article class="achievement ${got?'':'locked'}"><div class="icon">${got?a[1]:'🔒'}</div><h3>${got?a[2]:'???'}</h3><p>${got?'Conquistada! '+a[3]:'Continue sua aventura para descobrir.'}</p><small>${got?'🏅 registrada nesta aventura':'🔒 ainda bloqueada'}</small></article>`}).join('')}</section>`}function achievement(id){if(id==='digital')return [1,2,3].every(n=>state.done[String(n).padStart(2,'0')]);if(id==='bug')return state.ach.bug;if(id==='loops')return state.done['05']||state.done['18'];if(id==='scratch')return state.done['11'];if(id==='python')return state.done['18'];return state.done['24']}
function bag(){let items=ITEMS.map(a=>[...a, state.done[String(a[4]).padStart(2,'0')]||state.bag[a[0]]]);return `<p class="muted">A Mochila guarda ferramentas que você já encontrou na aventura.</p><section class="backpack">${items.map(a=>`<article class="backpack-item ${a[5]?'':'locked'}" ${a[5]?`onclick="showToast('${a[1]} ${a[2]}: ${a[3]}')"`:''}><div class="icon">${a[5]?a[1]:'🔒'}</div><h3>${a[5]?a[2]:'???'}</h3><p>${a[5]?a[3]:'Continue para encontrar esta ferramenta.'}</p></article>`).join('')}</section>`}
function lumi(){return `<section class="panel mission-head"><span class="phase">COMPANHEIRO DE AVENTURA</span><h3>💡 Dicas do Lumi</h3><p>Lumi não entrega a resposta. Ele dá pistas para você pensar e testar.</p><div class="lumi-tip"><b>Como pedir ajuda:</b><p>1. Conte o que esperava. 2. Conte o que aconteceu. 3. Teste uma parte pequena.</p></div><button class="cta" onclick="showToast('💡 Lumi diz: O que você acha que vai acontecer se mudar só uma coisa?')">💡 PEDIR UMA DICA</button></section>`}
function teacher(){let c=current()||M[23];return `<section class="panel mission-head"><span class="phase">MODO ADULTO</span><h3>👨‍🏫 Próxima aula: Missão ${c[0]}</h3><p>${c[1]} — ${c[5]}</p><button class="cta" onclick="openTeacherGuide('${c[0]}')">Abrir guia completo</button><div id="teacher-guide" class="teacher"><p>O guia completo será carregado daqui, sem sair do portal.</p></div></section><article class="teacher"><h3>Antes da aula</h3><p>Abra o material, prepare o aplicativo necessário e deixe a criança no teclado.</p></article><article class="teacher"><h3>Durante</h3><p>Use perguntas-pista: “O que você acha que vai acontecer?” e “Vamos testar uma parte?”</p></article><article class="teacher"><h3>Observe</h3><p>Ela prevê, testa e explica uma escolha? Isso vale mais do que terminar rápido.</p></article><article class="teacher"><h3>Se estiver difícil / fácil</h3><p>Reduza para uma versão menor ou peça uma personalização escolhida por ela.</p></article>`}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function renderGuide(md){let h=esc(md);h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n\n+/g,'</p><p>');return '<p>'+h+'</p>'}async function openTeacherGuide(n){let box=document.getElementById('teacher-guide');box.innerHTML='<p>Carregando guia da Missão '+n+'…</p>';try{let url='https://raw.githubusercontent.com/f4bio89/curso-programacao-criancas/main/missao_'+n+'/guia_professor.md';let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);box.innerHTML='<span class="phase">GUIA SINCRONIZADO DO MARKDOWN</span>'+renderGuide(await r.text());}catch(e){box.innerHTML='<p>Não foi possível carregar o guia agora. Verifique a conexão e tente novamente.</p>'}}function steps(x){return [['🎯 O Desafio',`Você precisa ${x[5].toLowerCase()} O que você já sabe que pode ajudar?`],['💡 Descoberta',x[4]],['🛠️ Vamos Construir',`Faça uma primeira versão pequena. A criança controla o computador; o adulto faz perguntas.`],['🧩 Sua Vez',`Agora mude uma coisa: personagem, nome, cor, regra ou resposta.`],['🐛 Caça ao Bug',bugContent(x[0])],['⭐ Desafio Extra',`Deixe a criação com a sua cara e mostre para alguém.`],['🏆 Missão Cumprida',`Conte: o que criou, qual bug encontrou e o que faria diferente.`]]}
function mission(n){let x=M.find(a=>a[0]===n);if(!x)return home();let done=state.done[n], st=steps(x), completed=Object.keys(state.steps[n]||{}).filter(k=>(state.steps[n]||{})[k]).length;return `<button class="cta" onclick="go('missions')">← MISSÕES</button><article class="panel mission-head"><span class="phase">MISSÃO ${n} · ${phaseName(x[2])}</span><h3>${x[3]} ${x[1]}</h3><div class="meta"><span class="chip">⏱ ~40 min</span><span class="chip">⭐ ${x[2]==='scratch'?'Scratch':x[2]==='python'||x[2]==='jogos'?'Python':'Aventura prática'}</span><span class="chip">🏅 +1 descoberta</span></div><p><b>🎯 Sua missão:</b> ${x[5]}</p><button class="cta" onclick="document.getElementById('steps').scrollIntoView()">🚀 COMEÇAR MISSÃO</button><div class="mission-progress"><b>ETAPAS ${completed} DE 7</b><div class="track"><i style="width:${completed/7*100}%"></i></div></div></article><section class="steps" id="steps">${st.map((s,i)=>`<details class="step" ${i===Math.min(completed,6)?'open':''}><summary>${state.steps[n]?.[i]?'✅':'○'} ${i+1} — ${s[0]}</summary><div class="step-body"><p>${s[1]}</p>${i===0?simulator(n):''}${i===1?lumiComponent(n):''}${i===4?bugTools(n):''}<button class="complete-step" onclick="completeStep('${n}',${i})">${state.steps[n]?.[i]?'✓ Etapa concluída':'Marcar etapa como concluída'}</button></div></details>`).join('')}</section><p class="small">Progresso salvo somente neste navegador.</p>${done?'<p class="lumi-tip"><b>🏆 Missão cumprida!</b> Você pode revisitar quando quiser.</p>':''}`}
function lumiComponent(n){let tips={05:['Pense no que está sendo repetido.','Existe uma forma de repetir vários comandos.','Procure a ideia de “repita”.'],08:['A nave precisa se mover muitas vezes.','Uma repetição evita copiar blocos.','Procure “repita”.'],default:['Observe o que mudou depois do teste.','Mude somente uma coisa por vez.','Explique sua hipótese antes de testar.']}[n]||null;tips=tips||({06:['A pergunta é: tem chave?','Se a resposta muda, o caminho também muda.','Use uma condição.'],09:['Pontos começam em zero.','Quando a moeda é tocada, algo muda.','A caixinha pontos pode somar 1.']}[n]||{default:null}).default||['O que você espera que aconteça?','Qual é a menor parte para testar?','Leia a instrução devagar.'];return `<div class="lumi-tip"><b>💡 Precisa de uma dica?</b><p id="tip-${n}" class="tip-out">Clique sem medo: Lumi só dá pistas.</p><button class="cta" onclick="nextTip('${n}',${JSON.stringify(tips).replace(/"/g,'&quot;')})">PEDIR UMA DICA</button></div>`}
function nextTip(n,data){let key='tip-'+n, i=+(state[key]||0), el=document.getElementById(key);el.textContent='💡 '+data[Math.min(i,data.length-1)];state[key]=i+1;save()}
function simulator(n){if(n==='04')return `<div class="sim"><h4>🤖 Mini simulador: guie Byte até o tesouro</h4><p>Monte um caminho. Byte começa no canto superior esquerdo; o tesouro está no canto inferior direito.</p><div class="board" id="board">${Array.from({length:16},(_,i)=>`<div class="cell ${i===15?'treasure':''}" id="byte-${i}">${i===0?'🤖':i===15?'💎':''}</div>`).join('')}</div><div class="sim-controls"><button onclick="robot('up')">⬆️</button><button onclick="robot('right')">➡️</button><button onclick="robot('down')">⬇️</button><button onclick="robot('left')">⬅️</button><button onclick="robot('run')">▶ EXECUTAR</button><button onclick="robot('reset')">↺ RECOMEÇAR</button></div><p id="robot-out" class="small">Comandos: nenhum ainda.</p></div>`;if(n==='05'||n==='08'||n==='18')return `<div class="sim"><h4>🔁 Mini simulador: repetição</h4><p>Para mover 5 vezes, você prefere apertar 5 comandos ou usar uma repetição?</p><div class="sim-controls"><button onclick="repeatDemo(1)">➡️ uma vez</button><button onclick="repeatDemo(5)">🔁 repita 5 vezes</button></div><p id="repeat-out" class="variable">→ 0</p></div>`;if(n==='06')return `<div class="sim"><h4>🚪 Mini simulador: condição</h4><p>Byte encontrou uma porta. Ele tem a chave?</p><div class="sim-controls"><button onclick="door(true)">🔑 SIM</button><button onclick="door(false)">🚫 NÃO</button></div><p id="door-out" class="small"></p></div>`;if(n==='09')return `<div class="sim"><h4>📦 Mini simulador: variável</h4><p>Uma variável é uma caixinha que guarda algo que muda.</p><p class="variable">PONTOS: <span id="points">0</span></p><div class="sim-controls"><button onclick="coin()">💎 coletar moeda</button></div></div>`;return ''}
let commands=[],pos=0,points=0;function drawByte(){for(let i=0;i<16;i++){let e=document.getElementById('byte-'+i);if(e)e.textContent=i===pos?'🤖':i===15?'💎':''}}function robot(x){let out=document.getElementById('robot-out');if(x==='reset'){commands=[];pos=0;drawByte();out.textContent='Comandos: nenhum ainda.';return}if(x==='run'){let queue=[...commands],step=()=>{if(!queue.length){out.textContent=pos===15?'💎 TESOURO ENCONTRADO!':'Byte parou antes do tesouro. Tente um caminho diferente.';return}let move=queue.shift(),row=Math.floor(pos/4),col=pos%4,next=pos;if(move==='up')next=row?pos-4:-1;if(move==='down')next=row<3?pos+4:-1;if(move==='left')next=col?pos-1:-1;if(move==='right')next=col<3?pos+1:-1;if(next<0){out.textContent='🧱 Ops! Byte saiu do mapa. Recomece e teste outra sequência.';return}pos=next;drawByte();out.textContent='Byte está seguindo: '+commands.slice(0,commands.length-queue.length).join(' ');if(pos===15){out.textContent='💎 TESOURO ENCONTRADO! Você criou um algoritmo que funciona!';return}setTimeout(step,420)};pos=0;drawByte();step();return}commands.push(x);out.textContent='Comandos: '+commands.map(m=>({up:'⬆️',right:'➡️',down:'⬇️',left:'⬅️'}[m])).join(' ')}function repeatDemo(n){document.getElementById('repeat-out').textContent='→ '+n+'   (você economizou '+(n-1)+' comandos!)'}function door(k){document.getElementById('door-out').textContent=k?'✅ A porta abre! O caminho continua.':'🔎 Procure uma chave antes de tentar abrir.'}function coin(){points++;document.getElementById('points').textContent=points;showToast('💎 Pontos agora: '+points)}
function bugContent(n){if(n==='12')return 'O programa deveria dizer “Olá, Elisa!”, mas falta alguma coisa no print.';if(n==='15')return 'O cofre deveria comparar a senha, mas o sinal usado está estranho.';if(n==='19')return 'O jogo deveria escolher entre opções, mas o nome da lista não bate.';return 'Durante a construção, encontre algo que não aconteceu como esperava. Isso é uma pista.'}function bugTools(n){if(['12','15','19'].includes(n))return `<div class="bug-box"><b>🐛 CAÇA AO BUG</b><pre class="code">${n==='12'?'print("Olá, Elisa!"':n==='15'?'if chave = 7:':'random.choice(opcao)'}</pre><div class="sim-controls"><button onclick="bugHint('${n}')">💡 Pista</button><button onclick="bugTest('${n}')">▶ Testar</button><button onclick="bugAnswer('${n}')">👀 Mostrar resultado</button></div><label for="bug-fix-${n}"><b>Sua correção:</b></label><input class="bug-input" id="bug-fix-${n}" aria-label="Sua correção do bug" placeholder="Escreva o código corrigido"><button class="complete-step" onclick="bugFix('${n}')">Conferir correção</button><p id="bug-${n}" class="small"></p></div>`;return `<div class="bug-box"><b>🐛 CAÇA AO BUG</b><p>Conte o que esperava e o que apareceu. Escolha uma pequena mudança para investigar.</p></div>`}function bugHint(n){document.getElementById('bug-'+n).textContent=n==='12'?'💡 Conte parênteses e aspas.':n==='15'?'💡 Para comparar duas coisas, Python usa dois sinais iguais.':'💡 A lista se chama opcoes, com s no final.'}function bugTest(n){document.getElementById('bug-'+n).textContent='▶ O computador mostrou um erro. Erros são pistas!'}function bugAnswer(n){document.getElementById('bug-'+n).textContent='👀 Resultado: '+(n==='12'?'Feche o parêntese.':n==='15'?'Use == para comparar.':'Use opcoes.')+' Agora escreva a correção para conquistar a medalha.'}function bugFix(n){let answer=document.getElementById('bug-fix-'+n).value.replace(/\s+/g,'').replace(/'/g,'"'),expected={12:'print("Olá,Elisa!")',15:'ifchave==7:',19:'random.choice(opcoes)'}[n].replace(/\s+/g,'');let out=document.getElementById('bug-'+n);if(answer===expected){out.textContent='🐛✨ BUG CAPTURADO! Você encontrou e corrigiu a pista.';state.ach.bug=true;save();nav();showToast('🏅 Conquista: Caçadora de Bugs!')}else out.textContent='Ainda não é essa correção. Veja a pista, teste e tente de novo.'}
function completeStep(n,i){state.steps[n]??={};state.steps[n][i]=true;if(i===6){state.done[n]=true;ITEMS.filter(a=>String(a[4]).padStart(2,'0')===n).forEach(a=>state.bag[a[0]]=true);save();nav();let x=M.find(a=>a[0]===n);openModal('🎉 MISSÃO CUMPRIDA!',`Você terminou ${x[1]}. Conte para alguém o que criou!`)}else{save();missionRefresh(n);showToast('✓ Etapa concluída!')} }function missionRefresh(n){document.getElementById('view').innerHTML=mission(n);nav()}function closeModal(){document.getElementById('modal').classList.remove('show');go('home')}function openModal(title,text){let m=document.getElementById('modal');m.dataset.returnFocus=document.activeElement?.id||'';document.getElementById('modal-title').textContent=title;document.getElementById('modal-text').textContent=text;m.setAttribute('aria-hidden','false');m.classList.add('show');document.getElementById('modal-close').focus()}function closeModal(){let m=document.getElementById('modal');m.classList.remove('show');m.setAttribute('aria-hidden','true');(document.getElementById(m.dataset.returnFocus)||document.getElementById('view')).focus?.();go('home')}document.addEventListener('keydown',e=>{let m=document.getElementById('modal');if(e.key==='Escape'&&m.classList.contains('show')){closeModal()}});boot();
</script></body></html>
