<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FFC400">
  <title>Code Aventura — Missões</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#172033;--yellow:#FFC400;--yellow-soft:#FFF3B0;--white:#fff;--grey:#F4F5F7;--line:#e6e9ef;--blue:#2676e8;--purple:#7555d9;--green:#2ca56e;--orange:#f07d22;--red:#df4b4b}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--grey);font:18px/1.55 Nunito,system-ui,sans-serif;color:var(--navy)}
    header{position:relative;overflow:hidden;background:var(--yellow);padding:2.1rem max(1.2rem,calc((100% - 1060px)/2));border-bottom:6px solid var(--navy)}header:before,header:after{content:'</>';position:absolute;color:#17203315;font:700 clamp(5rem,14vw,11rem) Fredoka;line-height:1}header:before{right:3%;top:-20px;transform:rotate(-10deg)}header:after{left:0;bottom:-68px;content:'{ }';transform:rotate(8deg)}
    .brand{position:relative;z-index:1;display:flex;align-items:center;gap:1.1rem}.lumi{width:88px;height:88px;flex:none;filter:drop-shadow(0 5px 0 #17203322)}.brand-copy h1{margin:0;font:700 clamp(2.2rem,6vw,4.2rem)/.95 Fredoka,sans-serif;letter-spacing:-.04em}.brand-copy h1 span{color:var(--navy)}.brand-copy h1 strong{color:var(--white);text-shadow:2px 2px 0 var(--navy)}.brand-copy p{margin:.55rem 0 0;font:800 .84rem/1 Nunito;letter-spacing:.16em;color:var(--navy)}
    main{max-width:1060px;margin:auto;padding:1.4rem}.journey{background:var(--white);border:2px solid var(--navy);border-radius:18px;padding:.75rem 1rem;margin:-.8rem 0 1.5rem;position:relative;z-index:2;box-shadow:5px 5px 0 var(--navy);font:700 .9rem Nunito}.journey span{color:var(--orange);padding:0 .25rem}.toolbar{display:flex;gap:.65rem;flex-wrap:wrap;align-items:center;margin:0 0 1.15rem}.toolbar button,.back{border:2px solid var(--navy);border-radius:12px;background:var(--white);padding:.6rem .85rem;font:800 .9rem Nunito;color:var(--navy);box-shadow:3px 3px 0 var(--navy);cursor:pointer}.toolbar button:hover,.back:hover{background:var(--yellow);transform:translate(-1px,-1px)}
    .progress{margin-left:auto;background:var(--navy);color:var(--white);padding:.65rem .9rem;border-radius:12px;font:800 .9rem Nunito}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:1rem}.card{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:1.15rem;box-shadow:0 5px 0 #dce0e7;cursor:pointer;transition:.16s;position:relative;overflow:hidden}.card:after{content:'✦';position:absolute;right:12px;top:7px;color:var(--yellow);font-size:1.7rem}.card:hover{transform:translateY(-5px);border-color:var(--navy);box-shadow:0 9px 0 var(--yellow)}.card h2{font:700 1.35rem/1.05 Fredoka;margin:.5rem 0}.number{font:800 .77rem Nunito;color:var(--orange);letter-spacing:.1em}.tag{display:inline-block;font:800 .72rem Nunito;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;background:var(--yellow-soft);padding:.22rem .6rem}.done{outline:4px solid var(--green)}.done:before{content:'✓';position:absolute;right:14px;bottom:12px;width:28px;height:28px;border-radius:50%;background:var(--green);color:white;text-align:center;font-weight:800}
    #mission{display:none;max-width:820px;margin:auto}.hero{background:var(--white);border:2px solid var(--navy);border-radius:24px;padding:clamp(1.25rem,4vw,2.5rem);box-shadow:7px 7px 0 var(--yellow)}.hero h2{font:700 clamp(2rem,5vw,3.25rem)/1 Fredoka;margin:.65rem 0}.hero h3{font:700 1.35rem Fredoka;margin:1.6rem 0 .45rem}.goal{font-size:1.15em}.box{background:var(--yellow-soft);border:2px solid var(--yellow);padding:1rem 1.15rem;border-radius:14px;margin:1rem 0}.steps{padding:0;list-style:none}.steps li{background:var(--grey);border:1px solid var(--line);border-radius:12px;margin:.65rem 0;padding:.75rem}.steps input{accent-color:var(--green);width:1.25rem;height:1.25rem;vertical-align:middle;margin-right:.55rem}.hint{display:none;background:var(--yellow-soft);border:2px dashed var(--orange);border-radius:12px;padding:1rem;margin-top:.7rem}.action{background:var(--yellow);border:2px solid var(--navy);box-shadow:3px 3px 0 var(--navy);color:var(--navy);border-radius:12px;font:800 .95rem Nunito;padding:.75rem 1rem;cursor:pointer}.link{display:inline-block;margin:.35rem .35rem .35rem 0;color:var(--white);background:var(--blue);border:2px solid var(--navy);box-shadow:2px 2px 0 var(--navy);padding:.5rem .7rem;border-radius:10px;text-decoration:none;font:800 .84rem Nunito}.reflect{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:.8rem;font:inherit}.small{font-size:.9em;color:#52607a} footer{text-align:center;padding:2rem;color:var(--navy);font-weight:800}@media(max-width:600px){body{font-size:16px}.brand{align-items:flex-start}.lumi{width:66px;height:66px}.progress{margin-left:0}.journey{font-size:.72rem}.toolbar button{font-size:.78rem}}
  </style>
</head>
<body>
<header><div class="brand"><svg class="lumi" viewBox="0 0 100 100" aria-label="Lumi, lâmpada curiosa"><path d="M27 45a23 23 0 1 1 46 0c0 11-7 15-11 22H38c-4-7-11-11-11-22Z" fill="#FFF3B0" stroke="#172033" stroke-width="5" stroke-linejoin="round"/><path d="M39 68h22M42 76h16M45 84h10" stroke="#172033" stroke-width="5" stroke-linecap="round"/><circle cx="42" cy="45" r="8" fill="#fff" stroke="#172033" stroke-width="3"/><circle cx="59" cy="45" r="8" fill="#fff" stroke="#172033" stroke-width="3"/><path d="M50 45h1M43 45h1M60 45h1M43 56q7 6 14 0" stroke="#172033" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M50 8v9M20 22l7 6M80 22l-7 6" stroke="#172033" stroke-width="5" stroke-linecap="round"/></svg><div class="brand-copy"><h1><span>Code</span> <strong>Aventura</strong></h1><p>PENSE • DESCUBRA • CRIE</p></div></div></header>
<main>
  <div class="journey">🏠 <span>→</span> 🧭 Exploradora <span>→</span> 🧩 Lógica <span>→</span> 🐱 Scratch <span>→</span> 🐍 Python <span>→</span> 🎮 Jogos <span>→</span> 🚀 Projeto <span>→</span> 🏆</div>
  <section id="home"><div class="toolbar"><button onclick="showOnly('digital')">🖱️ Exploradora Digital</button><button onclick="showOnly('pensamento')">🧠 Pensamento</button><button onclick="showOnly('scratch')">🐱 Scratch</button><button onclick="showOnly('python')">🐍 Python</button><button onclick="showOnly('projeto')">🏆 Projeto final</button><button onclick="showOnly('todas')">Ver todas</button><span class="progress" id="progress">0 / 24 concluídas</span></div><div class="grid" id="cards"></div></section>
  <section id="mission"><button class="back" onclick="goHome()">← Voltar ao mapa</button><article class="hero" id="content"></article></section>
</main>
<footer>💡 <b>Dica do Lumi:</b> bugs são pistas. Pense, descubra, crie e teste uma coisa de cada vez.</footer>
<script>
const M=[
 ['01','Domine seu Computador','digital','Conhecer desktop, janelas, mouse e teclado.','Criar um cartão “Meu computador”.','Abrir Arquivos e um editor de texto; experimentar minimizar, maximizar e trocar de janela.'],
 ['02','Detetive da Internet','digital','Descobrir pistas de links, downloads e mensagens estranhas.','Resolver três casos seguros de internet.','Antes de clicar, observe: quem mandou? O endereço parece conhecido? Pede segredo ou prêmio incrível?'],
 ['03','Organize sua Base Secreta','digital','Usar pastas, nomes, salvar e encontrar arquivos.','Montar a pasta Base_Secreta com três pistas.','Crie uma pasta; dê nomes claros aos arquivos; feche e encontre de novo.'],
 ['04','Programe um Robô Humano','pensamento','Dar instruções em sequência e bem precisas.','Ensinar um robô humano a fazer um sanduíche imaginário.','O adulto obedece literalmente. Se a instrução disser “pegue pão”, pergunte: qual pão? onde está?'],
 ['05','O Poder da Repetição','pensamento','Encontrar padrões e usar repetição.','Criar uma dança de robô com cartões de comando.','Em vez de escrever o mesmo passo muitas vezes, experimente “repita 4 vezes”.'],
 ['06','A Porta do Dragão','pensamento','Usar decisões do tipo se / então / senão.','Escolher caminhos em um mapa de tesouro.','Exemplo: SE a porta estiver trancada, ENTÃO procure a chave; SENÃO entre.'],
 ['07','Dê Vida ao Gato','scratch','Descobrir eventos, movimento e sequência no Scratch.','Animação de apresentação do gato.','Quando a bandeira verde clicar: diga uma frase, mova e gire.'],
 ['08','Resgate Espacial','scratch','Usar repetição para animar uma nave.','Nave voando entre estrelas.','Se a nave precisa andar muitas vezes, qual bloco evita copiar 20 movimentos?'],
 ['09','Tesouro que Conta Pontos','scratch','Criar variável de pontuação e detectar toque.','Jogo de coletar tesouros.','Comece pontos em zero; quando a nave tocar no tesouro, some um e mova o tesouro.'],
 ['10','Fuga do Meteoro','scratch','Usar condições e testar colisões.','Jogo de desviar de meteoros.','SE tocar no meteoro, mostre uma mensagem e pare.'],
 ['11','Estúdio de Jogos','scratch','Planejar, testar e melhorar um jogo inteiro.','Caça ao Cristal.','Faça alguém jogar sem explicação. O que essa pessoa não entendeu? Essa é uma ótima pista.'],
 ['12','Olá, Python!','python','Fazer o computador mostrar textos com print().','Cartão digital de heroína.','Abra desafio.py no Thonny, aperte F5 e troque o nome da heroína.'],
 ['13','O Quiz Conversador','python','Fazer perguntas com input() e guardar respostas.','Quiz de três perguntas.','Cada resposta precisa de uma caixa com nome: uma variável.'],
 ['14','Criador de Super-Heróis','python','Juntar texto e variáveis.','Ficha de super-herói.','Mude nome, poder e base. Depois invente mais um campo.'],
 ['15','Cofre dos Números','python','Usar números, comparação e if.','Cofre que abre com senha numérica.','Atenção: um único igual guarda um valor; dois iguais perguntam se são iguais.'],
 ['16','Dado das Aventuras','python','Usar random para criar surpresa.','Dado virtual com missão sorteada.','Rode várias vezes: o que muda? O que continua igual?'],
 ['17','Aventura das Escolhas','python','Criar caminhos com if, elif e else.','História interativa com finais.','Experimente ponte, caverna e uma palavra inesperada.'],
 ['18','A Fábrica de Repetições','python','Repetir com for e while.','Contagem regressiva espacial.','Depois da contagem, experimente a conversa segura com o Terminal.'],
 ['19','Pedra, Papel, Tesoura Turbo','python','Combinar random, regras, placar e repetição.','Jogo contra o computador.','Jogue três rodadas. Onde os pontos são guardados?'],
 ['20','Bola 8 Mágica Gentil','python','Criar e chamar uma função simples.','Oráculo divertido.','Uma função é uma receita que podemos chamar pelo nome.'],
 ['21','Laboratório de Histórias','python','Combinar listas, random, texto e função.','Gerador de histórias malucas.','Primeiro invente sua versão; depois, se quiser, faça a atividade IA como ajudante.'],
 ['22','Chatbot da Base Secreta','python','Combinar input, condições, loop e função.','Chatbot simples.','Teste oi, bug, jogo e sair. Depois ensine uma resposta nova.'],
 ['23','Oficina da Inventora','projeto','Planejar e começar um projeto próprio.','Protótipo do projeto final.','Escolha uma ideia pequena: primeiro faça a menor versão que consegue funcionar.'],
 ['24','Grande Estreia','projeto','Testar, depurar e explicar o projeto.','Apresentação para família.','Conte o que criou, como funciona, um bug e como o resolveu.']
];
const materials={scratch:'materiais/instrucoes_scratch.md',python:'materiais/LEIA_PRIMEIRO.md',projeto:'materiais/planejador_projeto.md'};
function key(n){return 'inventora-'+n} function count(){return M.filter(x=>localStorage.getItem(key(x[0]))==='ok').length}
function update(){document.getElementById('progress').textContent=count()+' / 24 concluídas'}
function render(filter='todas'){const c=document.getElementById('cards');c.innerHTML='';M.filter(x=>filter==='todas'||x[2]===filter).forEach(x=>{let d=document.createElement('article');d.className='card '+(localStorage.getItem(key(x[0]))==='ok'?'done':'');d.onclick=()=>openMission(x[0]);d.innerHTML=`<div class="number">MISSÃO ${x[0]}</div><h2>${x[1]}</h2><span class="tag">${x[2]}</span><p>${x[4]}</p>`;c.appendChild(d)})}
function showOnly(f){render(f);update()} function goHome(){location.hash='';document.getElementById('home').style.display='block';document.getElementById('mission').style.display='none';render();update()}
function openMission(n){const x=M.find(v=>v[0]===n), done=localStorage.getItem(key(n))==='ok', folder='https://github.com/f4bio89/curso-programacao-criancas/blob/main/missao_'+n+'/';let link='';if(materials[x[2]]) link=`<a class="link" target="_blank" href="${folder+materials[x[2]]}">Abrir material da missão ↗</a>`;if(x[2]==='python')link+=`<a class="link" target="_blank" href="${folder+'materiais/desafio.py'}">Ver desafio.py ↗</a>`; if(n==='18')link+=`<a class="link" target="_blank" href="${folder+'materiais/terminal_seguro.md'}">Terminal seguro ↗</a>`;if(n==='21')link+=`<a class="link" target="_blank" href="${folder+'materiais/ia_com_ajudante.md'}">IA como ajudante ↗</a>`;
 document.getElementById('home').style.display='none';document.getElementById('mission').style.display='block';document.getElementById('content').innerHTML=`<span class="tag">${x[2]}</span><h2>🚀 MISSÃO ${x[0]} — ${x[1]}</h2><p class="goal"><b>Sua missão:</b> ${x[4]}</p><div class="box"><b>🧩 Descoberta:</b> ${x[3]}</div><h3>Construção</h3><p>${x[5]}</p>${link}<h3>Checklist da inventora</h3><ul class="steps"><li><label><input type="checkbox"> Eu tentei antes de pedir ajuda.</label></li><li><label><input type="checkbox"> Eu testei uma mudança minha.</label></li><li><label><input type="checkbox"> Eu encontrei ou evitei um bug.</label></li><li><label><input id="done" type="checkbox" ${done?'checked':''}> Eu terminei e consigo explicar.</label></li></ul><button class="action" onclick="document.getElementById('hint').style.display='block'">💡 Mostrar uma pista</button><div class="hint" id="hint"><b>💡 Dica do Lumi:</b> não procure a solução inteira. Escolha a menor próxima ação: ler uma linha, testar um bloco, mudar uma palavra ou contar o que você espera que aconteça.</div><h3>🗣️ Explique para mim</h3><p class="small">O que você fez? O que mais gostou? Onde apareceu um bug? Como você resolveu?</p><textarea class="reflect" id="note" placeholder="Escreva ou peça para um adulto registrar sua explicação..."></textarea><p class="small">Suas marcações e notas ficam só neste navegador, neste computador.</p>`;
 document.getElementById('done').onchange=e=>{localStorage.setItem(key(n),e.target.checked?'ok':'');update()};const note=document.getElementById('note');note.value=localStorage.getItem(key(n)+'-note')||'';note.oninput=()=>localStorage.setItem(key(n)+'-note',note.value);location.hash='missao-'+n;window.scrollTo(0,0);update()}
window.addEventListener('hashchange',()=>{let n=location.hash.replace('#missao-','');if(M.some(x=>x[0]===n))openMission(n);else goHome()});render();update();if(location.hash) {let n=location.hash.replace('#missao-','');if(M.some(x=>x[0]===n))openMission(n)}
</script>
</body></html>
