site_name: Missões da Inventora
site_description: Curso prático de Computação e Programação para crianças
site_url: https://f4bio89.github.io/curso-programacao-criancas/
repo_url: https://github.com/f4bio89/curso-programacao-criancas
repo_name: f4bio89/curso-programacao-criancas
edit_uri: edit/main/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  .git/**
  .venv-docs/**
  site/**
  tests/**
  gerar_*.py
  .github/**
theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
nav:
  - Início: README.md
  - 🚀 Portal interativo: portal/index.html
  - Para o professor:
      - Guia geral: GUIA_DO_PROFESSOR.md
      - Progresso: PROGRESSO.md
      - Preparar Pop!_OS: setup/instalar_ferramentas.md
      - Verificar ambiente: setup/verificar_ambiente.md
  - Missões:
